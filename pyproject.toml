[project]
name = "novel-searah-mcp"
version = "0.0.1"
description = "MCP server for light novel / web novel marketing strategy support (Japan market)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "novel-searah-mcp contributors" }]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "diskcache>=5.6",
    "structlog>=24.1",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
]

[project.scripts]
novel-searah-mcp = "novel_searah_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_searah_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["novel_searah_mcp"]
